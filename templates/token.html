<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>API token</title>
  {% include "_style.html" %}
</head>
<body>
  <main class="narrow">
    <header>
      <div class="brand">authgate</div>
      <a class="back" href="/">&larr; Account</a>
    </header>

    <section class="card identity">
      <div>
        <p class="label">API token for</p>
        <h1><code>{{ resource }}</code></h1>
        <p class="notice">This token is shown once and is not stored anywhere &mdash; copy it now. Reloading this page will request a new one.</p>
        <textarea id="token" rows="6" readonly>{{ access_token }}</textarea>
        <div class="toolbar">
          <button class="primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('token').value)">Copy to clipboard</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
