<style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --text: #14202b;
      --muted: #5b6b7a;
      --border: #e2e7ec;
      --accent: #1a9c78;
      --accent-2: #2e7fd1;
      --accent-text: #ffffff;
      --danger: #b23a3a;
      --shadow: 0 1px 2px rgba(20, 32, 43, 0.06), 0 8px 24px rgba(20, 32, 43, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1720;
        --surface: #172230;
        --text: #e6edf3;
        --muted: #93a3b3;
        --border: #263442;
        --accent: #2fd39c;
        --accent-2: #5aa8ff;
        --accent-text: #0b1620;
        --danger: #ff7b7b;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(60rem 30rem at 50% -12rem, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
        var(--bg);
    }
    main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .brand { font-weight: 700; letter-spacing: 0.02em; font-size: 1.05rem; color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card.identity {
      border-top: 3px solid var(--accent);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .card.identity > div { flex: 1 1 auto; min-width: 0; }
    h1 code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.15rem; }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.25rem; }
    h1 { font-size: 1.35rem; margin: 0; font-weight: 650; word-break: break-word; }
    .email { color: var(--muted); margin: 0.15rem 0 0; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.75rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 0 0.5rem 0.5rem 0; }
    td { padding: 0.6rem 0.5rem 0.6rem 0; border-top: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
    td.when { white-space: nowrap; }
    td.ua { color: var(--muted); word-break: break-word; }
    td.actions { text-align: right; white-space: nowrap; }
    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem; margin-left: 0.4rem;
      border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
    }
    button {
      font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
      border-radius: 8px; padding: 0.45rem 0.9rem; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--accent);
      color: var(--accent-text); border: none;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.link {
      background: none; border: none; padding: 0; border-radius: 4px;
      color: var(--danger); font-weight: 500; text-decoration: underline; text-underline-offset: 0.2em;
    }
    form.inline { display: inline; }
    ul.tokens { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
    ul.tokens a {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); text-decoration: none; transition: border-color 0.15s, background 0.15s;
    }
    ul.tokens a:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
    ul.tokens a code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    ul.tokens a span { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
    a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
    main.narrow { max-width: 36rem; }
    p { margin: 0.5rem 0 0; }
    .notice {
      margin: 0.75rem 0 0; padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem;
      background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger);
    }
    textarea {
      display: block; width: 100%; margin-top: 1rem; padding: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; line-height: 1.4;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; resize: vertical;
    }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
    .label + .label, p + .label { margin-top: 1.5rem; }
    pre.example {
      margin: 0.75rem 0 0; padding: 0.75rem; overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; line-height: 1.4;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    .hint { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
    .back { color: var(--muted); font-size: 0.9rem; text-decoration: none; }
    .back:hover { color: var(--text); text-decoration: underline; text-underline-offset: 0.2em; }
</style>
