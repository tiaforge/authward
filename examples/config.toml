# Minimal, complete worked example: one pocket-id instance, two apps on one
# domain. Copy this to config.toml and edit the marked values — or run
# `authward init` to generate an equivalent file interactively.
#
# `cookie_signing_key` and `refresh_token_encryption_key` below are
# placeholders. Generate real ones (32 random bytes, hex-encoded) and either
# paste them in here (then `chmod 600` this file) or set them via the
# AUTHWARD_COOKIE_KEY / AUTHWARD_REFRESH_KEY environment variables
# instead, which take precedence when set.

[global]
cookie_signing_key = "REPLACE_WITH_32_RANDOM_BYTES_HEX_1111111111111111111111"
refresh_token_encryption_key = "REPLACE_WITH_32_RANDOM_BYTES_HEX_2222222222222222222222"
sqlite_path = "authward.db"
session_ttl_fallback_seconds = 3600
listen_addr = "127.0.0.1:8080"
# otel_endpoint = "http://localhost:4317"

# One identity provider: a single OIDC client registered at pocket-id, with
# https://auth.example.com/callback as its redirect URI. Domains and hosts
# refer to it by the name in the brackets.
[idp."pocketid"]
discovery_url = "https://idp.example.com/.well-known/openid-configuration"
client_id = "authward"
client_secret = "REPLACE_WITH_YOUR_OIDC_CLIENT_SECRET"

# One domain: everything on *.example.com shares this auth subdomain, this
# IdP, and (via the cookie's Domain=.example.com) a single sign-on session.
# `idp = ...` could be left out here since only one [idp] is defined.
[domain."example.com"]
auth_subdomain = "auth.example.com"
idp = "pocketid"

# Optional: uncomment to protect every other *.example.com host that Caddy
# sends here, without listing each one. Any [host] field can go in it.
# [domain."example.com".fallback]
# required_group = "users"

# A host with no overrides at all: its domain is inferred from the name,
# it uses the domain's IdP, requires no group, has no bypass paths. Any
# successful login passes.
[host."app.example.com"]

# A host that layers on the optional per-host fields.
[host."admin.example.com"]
required_group = "admins"
bypass_paths = ["/healthz", "/static/logo.svg", "/public/*"]
forward_identity_headers = true
